<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SSS2026 Presentation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.5.0/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.5.0/dist/theme/black.css">
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --primary-color: #bcd1e4;
            --accent-color: #7EC2A8;
            --qa-bg: #1a1c1f;
            --qa-border: #38516B;
        }
        .reveal { font-family: 'Hiragino Sans', 'Meiryo', sans-serif; }
        .reveal h1 { font-size: 2.5em; color: var(--primary-color); border-bottom: 3px solid var(--accent-color); padding-bottom: 10px; }
        .reveal h2 { font-size: 1.8em; color: var(--primary-color); }
        .reveal h3 { font-size: 1.4em; color: var(--accent-color); }
        .reveal ul { font-size: 0.8em; text-align: left; display: inline-block; }
        .qa-section { 
            background-color: var(--qa-bg); 
            border-left: 10px solid var(--qa-border); 
            padding: 20px !important; 
            border-radius: 8px;
            text-align: left !important;
            margin-top: 20px !important;
        }
        .qa-section h3 { color: var(--primary-color); margin-top: 0 !important; }
        .qa-content { font-size: 0.7em !important; }
        .content-slide { text-align: left !important; }
    </style>
</head>
<body>
    <div class="reveal">
        <div class="slides">
            <section>
                <h1>SSS2026 参加報告</h1>
                <h3>@Hirosima Univ</h3>
            </section>
            <section>
                <h1>TiTle </h1>
                <ul>
                    <li>a</li>
                    <li>b</li>
                </ul>
            </section>
    
            

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.5.0/dist/reveal.js"></script>
    <script>
        Reveal.initialize({ 
            hash: true,
            controls: true,
            progress: true,
            center: true,
            transition: 'slide'
        });
    </script>
</body>
</html>
